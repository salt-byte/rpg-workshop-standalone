<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{{ PRODUCT_NAME }}}</title>
<style>
html,body{margin:0;height:100%;background:#141418;overflow:hidden;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#ddd}
#unity-canvas{width:100%;height:100%;display:block;background:#141418}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#bar{width:min(320px,70vw);height:6px;background:#333;border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#e0457b;transition:width .2s}
#err{color:#f88;max-width:80vw;white-space:pre-wrap;font-size:13px}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><div>正在载入游戏…</div><div id="bar"><i></i></div><div id="err"></div></div>
<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
var canvas=document.querySelector('#unity-canvas');
createUnityInstance(canvas,{
  dataUrl:"Build/{{{ DATA_FILENAME }}}",
  frameworkUrl:"Build/{{{ FRAMEWORK_FILENAME }}}",
  codeUrl:"Build/{{{ CODE_FILENAME }}}",
  streamingAssetsUrl:"StreamingAssets",
  companyName:{{{ JSON.stringify(COMPANY_NAME) }}},
  productName:{{{ JSON.stringify(PRODUCT_NAME) }}},
  productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}}
},function(p){document.querySelector('#bar i').style.width=Math.round(p*100)+'%'})
.then(function(){document.querySelector('#loading').remove();canvas.focus()})
.catch(function(e){document.querySelector('#err').textContent='载入失败：'+e});
</script>
</body>
</html>
